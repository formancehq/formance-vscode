name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"
      - run: yarn package
      - name: Publish to the Visual Studio Marketplace
        # --skip-duplicate lets a rerun finish after a partial publication.
        run: yarn vsce publish --skip-duplicate --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
      - name: Publish to Open VSX
        run: yarn ovsx publish --skip-duplicate --packagePath *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber "$TAG" *.vsix
